<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Аффинные преобразования многогранника</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Аффинные преобразования многогранника</h1>
  </header>

  <main>
    <aside class="controls">
      <div class="file-row">
        <button id="loadSample">Загрузить пример (куб)</button>
        <button id="resetBtn">Сброс</button>
      </div>

      <section>
        <h3>Перемещение (translation)</h3>
        <label>Tx <input id="tx" type="range" 
          min="-400" max="400" step="1" value="0">
            <span id="txVal">0</span></label>
        <label>Ty <input id="ty" type="range" 
          min="-400" max="400" step="1" value="0">
            <span id="tyVal">0</span></label>
        <label>Tz <input id="tz" type="range" 
          min="-1000" max="1000" step="1" value="0">
            <span id="tzVal">0</span></label>
      </section>

      <section>
        <h3>Вращение (rotation, degrees)</h3>
        <label>Rx <input id="rx" type="range" 
          min="-180" max="180" step="1" value="0">
            <span id="rxVal">0</span></label>
        <label>Ry <input id="ry" type="range" 
          min="-180" max="180" step="1" value="0">
            <span id="ryVal">0</span></label>
        <label>Rz <input id="rz" type="range" 
          min="-180" max="180" step="1" value="0">
            <span id="rzVal">0</span></label>
      </section>

      <section>
        <h3>Масштабирование (scale)</h3>
        <label>Uniform <input id="s" type="range" 
          min="0.1" max="3" step="0.01" value="1">
            <span id="sVal">1.00</span></label>
        <label>ScaleX <input id="sx" type="range" 
          min="0.1" max="3" step="0.01" value="1">
            <span id="sxVal">1.00</span></label>
        <label>ScaleY <input id="sy" type="range" 
          min="0.1" max="3" step="0.01" value="1">
            <span id="syVal">1.00</span></label>
        <label>ScaleZ <input id="sz" type="range" 
          min="0.1" max="3" step="0.01" value="1">
            <span id="szVal">1.00</span></label>
      </section>

      <section>
        <h3>Просмотр</h3>
        <label>FOV <input id="fov" type="range" 
          min="200" max="1200" step="10" value="600">
            <span id="fovVal">600</span></label>
        <label><input id="showEdges" 
          type="checkbox" checked> Показать рёбра</label>
        <label><input id="showFaces" 
          type="checkbox" checked> Показать заполнение</label>
      </section>

      <p class="note">Вращение и масштаб выполняются относительно 
                центра (центроида) многогранника.</p>
    </aside>

    <section class="canvas-wrap">
      <canvas id="glCanvas" width="900" height="600"></canvas>
      <div class="info">
        <div>Вершин: <span id="vCount">0</span></div>
        <div>Граней: <span id="fCount">0</span></div>
        <div>Центроид: <span id="centroid">—</span></div>
      </div>
    </section>
  </main>

  <footer>
    <small>Реализация: Vanilla JS, Canvas 2D. Формат входа — JSON.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
