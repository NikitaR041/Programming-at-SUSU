<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Конвертер цветов: RGB ↔ CMYK ↔ HSI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Конвертер цветов</h1>

  <div class="models">
    <div class="model" id="rgb-block">
        <h2>RGB</h2>
        <label>R: [0;255]<input type="range" id="r" 
          min="0" max="255"></label>
        <label>G: [0;255]<input type="range" id="g" 
          min="0" max="255"></label>
        <label>B: [0;255]<input type="range" id="b" 
          min="0" max="255"></label>
        <div class="preview" id="rgb-preview"></div>
        <p>HEX: <span id="rgb-hex"></span></p>
      </div>

      <div class="model" id="cmyk-block">
        <h2>CMYK</h2>
        <label>C: [0;100]<input type="range" id="c" 
          min="0" max="100"></label>
        <label>M: [0;100]<input type="range" id="m" 
          min="0" max="100"></label>
        <label>Y: [0;100]<input type="range" id="y" 
          min="0" max="100"></label>
        <label>K: [0;100]<input type="range" id="k" 
          min="0" max="100"></label>
        <div class="preview" id="cmyk-preview"></div>
        <p>HEX: <span id="cmyk-hex"></span></p>
      </div>

      <div class="model" id="hsi-block">
        <h2>HSI</h2>
        <label>H: [0;359]<input type="range" id="hue" 
          min="0" max="359"></label>
        <label>S: [0;100]<input type="range" id="sat" 
          min="0" max="100"></label>
        <label>I: [0;100]<input type="range" id="int" 
          min="0" max="100"></label>
        <div class="preview" id="hsi-preview"></div>
        <p>HEX: <span id="hsi-hex"></span></p>
      </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
