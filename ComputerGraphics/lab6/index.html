<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Анимация: вращение, масштаб и перемещение квадрата</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Аффинная анимация квадрата</h1>

  <div class="controls">
    <div class="row">
      <button id="startBtn">Старт</button>
      <button id="pauseBtn">Пауза</button>
      <button id="resetBtn">Сброс</button>
    </div>

    <div class="row">
      <label>Скорость движения: <input id="velRange"
         type="range" min="0" max="8" step="0.1" value="2">
          <span id="velVal">2</span></label>
      <label>Скорость вращения: <input id="rotRange"
         type="range" min="0" max="0.3" step="0.01" value="0.03">
          <span id="rotVal">0.03</span></label>
    </div>

    <div class="row">
      <label>Минимальный масштаб: <input id="minScale"
         type="number" step="0.1" value="0.5"> </label>
      <label>Максимальный масштаб: <input id="maxScale"
         type="number" step="0.1" value="1.5"> </label>
      <label>Скорость изменения масштаба: <input id="scaleSpeed"
         type="range" min="0.001" max="0.05" step="0.001" value="0.01">
          <span id="scaleVal">0.01</span></label>
    </div>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>

  <p class="hint">Квадрат движется, поворачивается по часовой стрелке
     и плавно меняет размер. 
    При столкновении — отражается.</p>

  <script src="script.js"></script>
</body>
</html>
